{{ define "main" }}
<section>
    <div class="container">
        <div class="row">
            <div class="col-sm-12">
                <h1>{{ .Title }}</h1>
                {{ .Content }}
                {{ with .Pages }}
                    <ul>
                        {{ range .ByTitle }}
                            <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
                        {{ end }}
                    </ul>
                {{ end }}
            </div>
        </div>
    </div>
</section>
{{ end }}
