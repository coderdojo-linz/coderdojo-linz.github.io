baseURL = "https://linz.coderdojo.net"
locale = "de-AT"
title = "CoderDojo Linz"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    style = "vs"
    tabWidth = 4

[params]

[security]
  # Tutorial downloads include HTML files in content; keep Org files blocked.
  allowContent = ['! ^text/org$']
